send:
  target:
    entity:
      integration: pipup
      domain: notify
  fields:
    title:
      example: "Front door"
      selector:
        text:
    message:
      example: "Someone is at the door"
      selector:
        text:
          multiline: true
    id:
      example: doorbell
      selector:
        text:
    duration:
      example: 20
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: seconds
          mode: box
    position:
      example: 0
      selector:
        select:
          translation_key: position
          options:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
    tts:
      example: "Someone is at the front door"
      selector:
        text:
    sound:
      selector:
        text:
    image_uri:
      example: "https://camera.local/snapshot.jpg"
      selector:
        text:
    video_uri:
      example: "rtsp://camera.local/stream"
      selector:
        text:
    web_uri:
      selector:
        text:
    media_width:
      example: 480
      selector:
        number:
          min: 64
          max: 1920
          unit_of_measurement: px
          mode: box
    web_height:
      selector:
        number:
          min: 64
          max: 1080
          unit_of_measurement: px
          mode: box
    muted:
      selector:
        boolean:
    background_color:
      example: "#CC000000"
      selector:
        text:
    title_color:
      example: "#34D399"
      selector:
        text:
    title_size:
      selector:
        number:
          min: 8
          max: 48
          mode: box
    message_color:
      selector:
        text:
    message_size:
      selector:
        number:
          min: 8
          max: 48
          mode: box
    corner_radius:
      example: 16
      selector:
        number:
          min: 0
          max: 64
          unit_of_measurement: px
          mode: box
    border_color:
      selector:
        text:
    border_width:
      selector:
        number:
          min: 0
          max: 16
          unit_of_measurement: px
          mode: box
    urgency:
      example: warning
      selector:
        select:
          translation_key: urgency
          options:
            - info
            - warning
            - critical
    icon_uri:
      selector:
        text:
    show_progress:
      selector:
        boolean:
    replace:
      selector:
        boolean:
    callback:
      selector:
        text:
    buttons:
      example: '[{"id": "unlock", "label": "Open the door"}, {"id": "ignore", "label": "Dismiss"}]'
      selector:
        object:
    button_color:
      example: "#1565C0"
      selector:
        text:
    button_text_color:
      selector:
        text:
    media_position:
      example: 0
      selector:
        select:
          translation_key: media_position
          options:
            - "0"
            - "1"
            - "2"
            - "3"
    title_alignment:
      selector:
        select:
          translation_key: title_alignment
          options:
            - "0"
            - "1"
            - "2"
    message_alignment:
      selector:
        select:
          translation_key: message_alignment
          options:
            - "0"
            - "1"
            - "2"
    animation_type:
      example: fade
      selector:
        select:
          translation_key: animation_type
          options:
            - none
            - fade
            - slide
            - scale
    animation_duration:
      example: 250
      selector:
        number:
          min: 0
          max: 2000
          unit_of_measurement: ms
          mode: box
    animation_exit:
      selector:
        boolean:
